# ICASSP-2027 Scenario-B pre-registration — v2, FROZEN at DECISION-V4-09 + V4-10 (2026-08-26).
# Single source of truth for the frozen numbers. Code reads this; do not change any value
# after seeing data. The smoke measures execution/cost ONLY and never tunes these.
# Contract: docs/master_plan_v4_amendment_icassp.md (rev4, ADOPTED), docs/publication_decision_memo.md §5.
#
# VERSIONED — v1 preserved verbatim at configs/research/icassp_gate0_prereg_v1_superseded.yaml
# (sha256 bfddd527…). These are PRE-DATA protocol corrections, not result-driven tuning:
#   v2 changelog (DECISION-V4-10 + arithmetic budget correction, 2026-08-26, no compute):
#     - clip length: train_clip_seconds 10.24 -> 3.84 ; add latent_t_size 96 ; add mel_target_length 384.
#       Rationale: KIM-CLIP-LENGTH audit (scripts/research/kim_clip_length_audit.py) — the U-Net
#       requires latent_t divisible by 8; exact 4.0 s (latent 100) fails; 3.84 s (latent 96) is the
#       nearest shorter VALID duration, strict-loads the SAME weights, has a valid loss, and leaves
#       pruning + Scenario-B LoRA transfer unchanged. NOT the "256-fixed / must pad to 10.24 s" premise
#       (refuted). This is a near-4-s M-Full transposition of Kim, NOT an exact S-Full replication.
#     - add crop_policy: deterministic CENTER crop (Kim released no preprocessing/boundary convention;
#       fixed center crop is the default; FROZEN — never change after training begins).
#     - budget: hard cap 3.5 stays as a ceiling but the EFFECTIVE cap is min(3.5, balance-reserve)
#       = min(3.5, 5.0-2.0) = 3.0 cr while balance=5.0 and reserve>=2.0 bind (arithmetic, not scientific).

decision: DECISION-V4-09 + DECISION-V4-10
adopted_utc_montevideo: "2026-08-26 03:02 (V4-09); 2026-08-26 13:48 (V4-10 clip-length)"
substrate: audioldm-m-full            # dense, channel_mult (1,2,3,5)

# --- Gate 0: powered replication of the Kim et al. (Appl. Sci. 2025) recipe on dense M-Full ---
gate0:
  lora:
    target_substrings: ["to_q", "to_v"]   # all attention layers, mirror Kim
    rank: 8
    alpha: 16
    dropout: 0.0
  optim:
    name: adamw
    lr: 1.0e-5
    effective_batch_size: 2               # LOCKED (fidelity); no auto-shrink to fit cost -> STOP-0
    # --- code-derived from Kim's train_audioldm_lora.py (github 2025-comprehensive-design/AudioLDM-with-LoRA) ---
    gradient_accumulation_steps: 1        # Kim: gradient_accumulation_steps = 1
    shuffle: true                         # Kim DataLoader shuffle=True (we seed it for determinism)
    drop_last: false                      # Kim DataLoader has NO drop_last -> ceil(193/2)=97 steps/epoch
    steps_per_epoch: 97                   # = ceil(193/2); Kim max_train_steps=97000 = 97*1000 confirms drop_last=False
    optimizer_updates_200ep: 19400        # EXACT: 97 * 200 (not 19.2k). The last batch each epoch is size 1.
    lr_scheduler:                         # Kim: get_scheduler("polynomial", warmup 0, num_training_steps=97000)
      type: polynomial                    # diffusers default power=1.0 (linear), lr_end=1e-7
      num_warmup_steps: 0
      num_training_steps: 97000           # Kim's FULL 1000-epoch horizon; our 200-ep run uses its first 19400 steps
      power: 1.0
      lr_end: 1.0e-7
  data:
    name: kim-hiphop-193                  # Rofla/AudioLDM-with-LoRA-Hiphop-subgenre (HF, Apache-2.0)
    n_clips: 193
    kim_source_clip_seconds: 4.0          # Kim's clips are 4 s (HF audio at 44.1 kHz)
    train_clip_seconds: 3.84              # DECISION-V4-10: nearest shorter VALID duration under the
                                          # U-Net latent_t-divisible-by-8 constraint (audit-proven).
                                          # True near-4-s training; NO padding. 3.84 s @ 16 kHz.
    latent_t_size: 96                     # 3.84 s -> mel 384 frames -> VAE /4 -> latent time 96 (div 8)
    mel_target_length: 384                # data-pipeline mel target = int(3.84 * 16000 / 160) = 384
    crop_policy: center                   # FROZEN deterministic center crop of each resampled 16 kHz
                                          # clip to exactly 61440 samples (3.84 s); clips shorter than
                                          # 3.84 s -> symmetric zero-pad. NO random offset. Kim released
                                          # no preprocessing/boundary convention -> center is the default.
                                          # NEVER change after training begins (ledger DECISION-V4-10).
  epochs: 200                             # first published checkpoint = affordable operating point
                                          # (NOT a "best band"; reproduction, not exact replication)
  primary_scorer: laion-clap-htsat-fused  # Kim's scorer
  endpoint: delta_clap_dense              # paired mean(adapter - base) on the held-out battery
  SESOI: 0.025                            # = half Kim's reported +0.0498
  pass_rule: "point >= SESOI AND lower_CI95 > 0"
  fail_action: STOP-1                     # thesis dead; no adapter iteration

# --- Held-out evaluation battery (frozen before the smoke) ---
battery:
  n_prompts: 64                           # EXACT, not "approximately"
  n_seeds: 3                              # paired generation seeds
  generations_per_system: 192
  source: musiccaps                       # text only; no audio scraping needed
  manifest: configs/research/icassp_gate0_battery.json  # v2 (leakage-fixed)
  frozen_prompts_sha256: ba4ebb5061959bc7a29137ac42c1c574133c35132fc2bb883b78b724c11308ad
  rule: "hip-hop/rap-filtered MusicCaps; deterministic order sha256(seed|ytid); first 64"
  disjoint_from: kim-hiphop-193
  disjoint_rule: "PRIMARY = recovered Kim training-source ytid (kim193_source_ytids.json, 44 ytids); SECONDARY = caption exact + near-dup"
  leakage_note: "Kim captions = MusicCaps captions + subgenre suffix; source recovered 45/45 to 44 ytids. v1 (sha 46ee4203) leaked ytid ZnBvXFDWpWo; v2 excludes by source ytid (0 leak)."
  ddim_steps: 50
  guidance: default                       # AudioLDMPipeline default, mirroring Kim's val path
  gen_clip_seconds: 3.84                  # DECISION-V4-10: generate at the adapter's TRAINED length
                                          # (latent_t 96), matching gate0.data.train_clip_seconds; 3.84 s
                                          # < CLAP's 10 s audio window so no scorer truncation
  no_hand_curation: true

# --- CI construction: ONE definition everywhere (Gate 0, E(s), F(s), every severity) ---
ci:
  method: cluster_percentile_bootstrap
  interval: two_sided_95
  B: 10000
  seed: 20260826
  resampling_unit: prompt                 # seeds stay clustered inside each resampled prompt
  impl: research_pruning/eval/cluster_bootstrap.py

# --- Phenomenon falsifier (post-Gate-0, generation only, no training) ---
phenomenon:
  severities: ["dense", "1_2_3_4", "1_2_3_1"]   # 0 / -23.7% / -65% (published Arshdeep artifact)
  systems: ["backbone", "backbone_plus_sliced_lora"]
  definitions:
    E: "C(0) - C(s)      # standalone CLAP degradation"
    D: "dCLAP(0) - dCLAP(s)  # adapter uplift lost"
    F: "D(s) - E(s)      # excess adapter loss"
  gate:
    standalone_preserved: "upper_CI95[E(s)] <= 0.025"
    differential_fragility: "point F(s) >= 0.025 AND lower_CI95[F(s)] > 0"
    phenomenon: "standalone_preserved AND differential_fragility"
    descriptive_only_if: "F positive but standalone_preserved false (generic capacity loss)"
  claim_scope: "standalone text-audio semantic alignment (CLAP); FAD/KAD corroborative only"
  fail_action: STOP-2                      # pre-registered negative; no method work

# --- Budget / STOPs ---
budget:
  smoke_ceiling_cr: 0.1
  gate0_ceiling_cr: 1.0                    # STOP-0: if smoke projects Gate 0 > this, re-cost to Gabriel
  falsifying_chain_ceiling_cr: 2.5
  icassp_hard_cap_cr: 3.5                  # nominal ceiling (kept for reference)
  reserve_cr: 2.0                          # binding
  account_balance_cr: 5.0                  # MEASURED 2026-08-26 16:27 UTC (lightning_sdk); see compute_budget.md
  effective_cap_cr: 3.0                    # BINDING = min(icassp_hard_cap_cr, account_balance_cr - reserve_cr)
                                           # = min(3.5, 5.0-2.0) = 3.0 while balance=5.0 and reserve>=2.0.
                                           # Arithmetic correction (DECISION-V4-10), not a scientific amendment.
                                           # STOP-3 fires at this effective cap.
  completion_tranche: "re-costed AFTER a positive falsifier with ACTUAL smoke costs; adapter B + full ladder BEFORE oracle; NOT guaranteed to fit under 3.0 cr"
